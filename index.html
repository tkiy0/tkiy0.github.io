<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ツキヤマ</title>
<meta name="description" content="ツキヤマ のSNS・リンクまとめ">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --card: rgba(255,255,255,.72);
    --card-solid: #ffffff;
    --fg: #1d1d1f;
    --sub: #6e6e73;
    --hair: rgba(0,0,0,.08);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.05), 0 16px 40px rgba(0,0,0,.10);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: rgba(28,28,30,.72);
      --card-solid: #1c1c1e;
      --fg: #f5f5f7;
      --sub: #98989d;
      --hair: rgba(255,255,255,.10);
      --shadow: 0 0 0 1px rgba(255,255,255,.06);
      --shadow-hover: 0 0 0 1px rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100svh;
    display: flex;
    justify-content: center;
    padding: calc(72px + env(safe-area-inset-top)) 22px calc(48px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.01em;
  }
  /* 背景のごく淡いグラデーション */
  body::before {
    content: ""; position: fixed; inset: -20% -20% auto; height: 70vh; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 60% at 50% 0%, rgba(160,170,190,.22), transparent 70%);
  }
  main { width: 100%; max-width: 420px; }

  /* プロフィール */
  .profile { text-align: center; }
  .avatar {
    width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 22px;
    background: linear-gradient(145deg, #d9dbe0, #b9bcc4);
    display: grid; place-items: center;
    font: 400 36px/1 "Inter", sans-serif; color: #fff; letter-spacing: 0;
    box-shadow: 0 0 0 4px var(--card-solid), 0 10px 30px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    font-size: 32px; font-weight: 500; letter-spacing: -.01em; line-height: 1.1;
  }
  .roman {
    margin-top: 8px; font-family: "Inter", -apple-system, sans-serif;
    font-size: 12px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase;
    color: var(--sub); padding-left: .28em;
  }
  .handle { margin-top: 10px; font-size: 15px; color: var(--sub); }
  .bio { margin: 18px auto 0; max-width: 320px; font-size: 15px; line-height: 1.7; color: var(--sub); }
  .bio strong { color: var(--fg); font-weight: 400; font-family: "Inter", -apple-system, sans-serif; font-size: 14px; letter-spacing: .08em; }

  /* リンク */
  .links { list-style: none; margin-top: 40px; display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px; border-radius: var(--radius);
    background: var(--card);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    box-shadow: var(--shadow);
    color: var(--fg); text-decoration: none;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s cubic-bezier(.2,.8,.2,1);
    -webkit-tap-highlight-color: transparent;
  }
  .link:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .link:active { transform: scale(.98); transition-duration: .15s; }
  .link:focus-visible { outline: 2px solid #0071e3; outline-offset: 3px; }
  .icon {
    width: 44px; height: 44px; flex: none; border-radius: 12px;
    display: grid; place-items: center; background: var(--bg);
  }
  .icon svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .text { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 500; }
  .desc { font-size: 13px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { flex: none; width: 8px; height: 14px; stroke: var(--sub); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .7; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .link:hover .chev { transform: translateX(3px); }

  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--sub); opacity: .8; }

  /* 表示アニメーション */
  .reveal { opacity: 0; transform: translateY(14px); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; transform: none; } }
</style>
</head>
